<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 UTF-8로 지정 -->
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 화면 크기에 맞게 보이도록 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카운터 앱</title>
  <!-- Tailwind CSS를 CDN(인터넷 주소)으로 불러오기: 설치 없이 바로 사용 가능 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- body: 화면 전체 배경을 연한 파란색으로, 내용은 화면 정중앙에 배치 -->
<body class="min-h-screen bg-blue-50 flex items-center justify-center">

  <!-- 카드 상자: 흰 배경 + 둥근 모서리 + 그림자 -->
  <main class="bg-white rounded-2xl shadow-lg p-10 w-80 text-center">

    <!-- 제목 -->
    <h1 class="text-2xl font-bold text-blue-900 mb-6">카운터</h1>

    <!-- 현재 숫자를 보여주는 곳. id="count"로 이름표를 붙여 JavaScript에서 찾을 수 있게 함 -->
    <p id="count" class="text-7xl font-extrabold text-blue-600 mb-8">0</p>

    <!-- 증가/감소 버튼을 가로로 나란히 배치 -->
    <div class="flex gap-4 mb-4">
      <!-- 감소 버튼 (-1) -->
      <button
        id="decrease"
        class="flex-1 bg-blue-400 hover:bg-blue-500 active:bg-blue-600 text-white text-2xl font-bold py-3 rounded-xl transition"
      >
        -1
      </button>

      <!-- 증가 버튼 (+1) -->
      <button
        id="increase"
        class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-2xl font-bold py-3 rounded-xl transition"
      >
        +1
      </button>
    </div>

    <!-- 리셋 버튼: 테두리만 파란색인 스타일로 다른 버튼과 구분 -->
    <button
      id="reset"
      class="w-full border-2 border-blue-600 text-blue-600 hover:bg-blue-50 font-semibold py-2 rounded-xl transition"
    >
      리셋
    </button>
  </main>

  <script>
    // 1) 현재 숫자를 기억하는 변수. 처음 값은 0
    let count = 0;

    // 2) HTML에서 이름표(id)로 필요한 요소들을 찾아오기
    const countDisplay = document.getElementById("count");
    const increaseBtn = document.getElementById("increase");
    const decreaseBtn = document.getElementById("decrease");
    const resetBtn = document.getElementById("reset");

    // 3) 화면의 숫자를 변수 count 값으로 바꿔주는 함수
    function updateDisplay() {
      countDisplay.textContent = count;
    }

    // 4) 각 버튼을 클릭했을 때 할 일을 등록
    increaseBtn.addEventListener("click", function () {
      count = count + 1; // 1 더하기
      updateDisplay();   // 화면 갱신
    });

    decreaseBtn.addEventListener("click", function () {
      count = count - 1; // 1 빼기
      updateDisplay();
    });

    resetBtn.addEventListener("click", function () {
      count = 0;         // 처음 값으로 되돌리기
      updateDisplay();
    });
  </script>
</body>
</html>
