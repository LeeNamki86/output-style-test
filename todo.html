<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투두 리스트</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #8a8f98;
      --accent: #4f6bed;
      --border: #e3e5e8;
      --danger: #e5484d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #e8eaed;
        --muted: #8a8f98;
        --accent: #7b93ff;
        --border: #2e3238;
        --danger: #ff6b6f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { margin: 0 0 16px; font-size: 22px; }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      padding: 10px 16px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    ul { list-style: none; padding: 0; margin: 20px 0 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li span { flex: 1; word-break: break-all; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    .delete {
      background: none;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 18px;
    }
    .delete:hover { color: var(--danger); }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer button {
      background: none;
      color: var(--muted);
      padding: 4px 0;
      font-size: 13px;
    }
    .footer button:hover { color: var(--danger); }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 할 일 목록</h1>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요" autocomplete="off" required>
      <button type="submit">추가</button>
    </form>

    <ul id="todo-list"></ul>

    <div class="footer">
      <span id="count"></span>
      <button id="clear-done" type="button">완료 항목 삭제</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'simple-todos';

    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const count = document.getElementById('count');
    const clearDoneBtn = document.getElementById('clear-done');

    let todos = load();

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch {
        // 저장소를 쓸 수 없는 환경(시크릿 모드 등)에서는 메모리에만 유지
      }
    }

    function render() {
      list.innerHTML = '';

      if (todos.length === 0) {
        list.innerHTML = '<li class="empty">할 일이 없습니다 🎉</li>';
      }

      todos.forEach(todo => {
        const li = document.createElement('li');
        li.className = todo.done ? 'done' : '';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => toggle(todo.id));

        const text = document.createElement('span');
        text.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = '×';
        del.title = '삭제';
        del.addEventListener('click', () => remove(todo.id));

        li.append(checkbox, text, del);
        list.appendChild(li);
      });

      const left = todos.filter(t => !t.done).length;
      count.textContent = `남은 할 일 ${left}개 / 전체 ${todos.length}개`;
    }

    function add(text) {
      todos.push({ id: Date.now(), text, done: false });
      update();
    }

    function toggle(id) {
      todos = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
      update();
    }

    function remove(id) {
      todos = todos.filter(t => t.id !== id);
      update();
    }

    function update() {
      save();
      render();
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text);
      input.value = '';
      input.focus();
    });

    clearDoneBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      update();
    });

    render();
  </script>
</body>
</html>
